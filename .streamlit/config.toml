# Purpose: Streamlit theme and settings for the Lakeshore Health Member Assistant.

[theme]
base = "light"
primaryColor = "#1D9E75"              # green, matches the slide deck
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F8"  # sidebar and chat input
textColor = "#1F2933"
font = "sans serif"

[client]
toolbarMode = "minimal"               # hide developer menu items

[browser]
gatherUsageStats = false
